<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal CTF</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1c2128; --muted: #667085; --line: #dfe3e8; --accent: #2f6feb; --ok: #1a7f4b; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1d2229; --text: #e6e9ee; --muted: #98a2b3; --line: #2e353f; --accent: #6ea0ff; --ok: #4cc38a; --bad: #ff7b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  h1 { font-size: 22px; margin: 0; }
  #summary { color: var(--muted); }
  main { max-width: 1000px; margin: 0 auto; padding: 8px 16px 40px; }
  h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  button.chal { text-align: left; background: var(--card); color: inherit; border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; font: inherit; }
  button.chal:hover, button.chal:focus-visible { border-color: var(--accent); outline: none; }
  button.chal.solved { border-color: var(--ok); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge { color: var(--ok); font-weight: 600; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); width: min(620px, calc(100vw - 32px)); padding: 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h3 { margin: 0 0 4px; font-size: 18px; }
  #desc { white-space: pre-wrap; margin: 12px 0; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; font-size: 13px; word-break: break-all; }
  a { color: var(--accent); }
  ul { margin: 6px 0; padding-left: 20px; }
  form { display: flex; gap: 8px; margin-top: 16px; }
  input { flex: 1; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: inherit; font: 14px ui-monospace, monospace; }
  form button, #close { padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  #close { background: transparent; color: var(--muted); float: right; padding: 4px 10px; }
  #result { min-height: 22px; margin-top: 10px; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<header><h1>Rehearsal CTF</h1><span id="summary"></span></header>
<main id="board"></main>
<dialog id="dlg">
  <button id="close" type="button">닫기</button>
  <h3 id="title"></h3>
  <div class="meta" id="meta"></div>
  <div id="desc"></div>
  <div id="conn"></div>
  <div id="files"></div>
  <div id="hints"></div>
  <form id="form"><input id="flag" placeholder="REHEARSAL{...}" autocomplete="off" spellcheck="false"><button>제출</button></form>
  <div id="result"></div>
</dialog>
<script>
const TOKEN = "__TOKEN__";
const api = (path, body) => fetch("/api/v1" + path, {
  method: body ? "POST" : "GET",
  headers: { "Authorization": "Token " + TOKEN, "Content-Type": "application/json" },
  body: body ? JSON.stringify(body) : undefined,
}).then(r => r.json());
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const $ = id => document.getElementById(id);
let current = null;

async function load() {
  const list = (await api("/challenges")).data;
  const board = $("board");
  board.replaceChildren();
  const cats = [...new Set(list.map(c => c.category))];
  for (const cat of cats) {
    board.append(el("h2", null, cat));
    const grid = el("div", "grid");
    for (const c of list.filter(c => c.category === cat)) {
      const b = el("button", "chal" + (c.solved_by_me ? " solved" : ""));
      b.append(el("div", "name", c.name), el("div", "meta", `${c.value}점 · ${c.solves} solves`));
      if (c.solved_by_me) b.append(el("div", "badge", "✔ solved"));
      b.onclick = () => open(c.id);
      grid.append(b);
    }
    board.append(grid);
  }
  const solved = list.filter(c => c.solved_by_me);
  $("summary").textContent = `${solved.length}/${list.length} 풀림 · ${solved.reduce((s, c) => s + c.value, 0)}점`;
}

function section(id, label, items) {
  const box = $(id);
  box.replaceChildren();
  if (!items.length) return;
  box.append(el("div", "meta", label));
  const ul = el("ul");
  for (const item of items) { const li = el("li"); li.append(item); ul.append(li); }
  box.append(ul);
}

async function open(id) {
  const c = (await api("/challenges/" + id)).data;
  current = c;
  $("title").textContent = c.name;
  $("meta").textContent = `${c.category} · ${c.value}점 · ${c.solves} solves` + (c.solved_by_me ? " · ✔ solved" : "");
  $("desc").textContent = c.description;
  section("conn", "접속 정보", c.connection_info ? [el("code", null, c.connection_info)] : []);
  section("files", "파일", c.files.map(f => { const a = el("a", null, decodeURIComponent(f.split("?")[0].split("/").pop())); a.href = f; return a; }));
  section("hints", "힌트", c.hints.map(h => h.content || `잠긴 힌트 (비용 ${h.cost}점)`));
  $("result").textContent = ""; $("result").className = ""; $("flag").value = "";
  $("dlg").showModal();
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const flag = $("flag").value.trim();
  if (!flag || !current) return;
  const r = (await api("/challenges/attempt", { challenge_id: current.id, submission: flag })).data;
  $("result").textContent = r.status === "correct" ? "정답입니다" : "오답입니다";
  $("result").className = r.status === "correct" ? "ok" : "bad";
  load();
};
$("close").onclick = () => $("dlg").close();
load();
setInterval(load, 5000);
</script>
</body>
</html>
